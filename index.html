<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Conversation Preparation</title>
    <style>
      body {
        font-family: "Arial", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      }
      .container {
        text-align: center;
        background: #ffffff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        max-width: 800px;
        margin: 20px;
      }
      #passage,
      #startScreen,
      #promptContainer {
        display: none;
      }
      #passage {
        font-size: 1.1em;
        line-height: 1.6;
        margin-bottom: 30px;
        color: #444;
        display: block;
      }
      #passage h2 {
        color: #007bff;
        margin-top: 0;
      }
      #startButton,
      #firstPromptButton,
      #nextButton {
        padding: 10px 20px;
        font-size: 1em;
        color: #ffffff;
        background-color: #007bff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        margin-top: 20px;
      }
      #startButton:hover,
      #firstPromptButton:hover,
      #nextButton:hover {
        background-color: #0056b3;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      #sessionStatus {
        margin-top: 20px;
        color: #444;
      }
      #sessionStatus.error {
        color: #b00020;
        font-weight: bold;
      }
      #prompt {
        font-size: 1.5em;
        margin-bottom: 20px;
        color: #333333;
      }
      #timer {
        font-size: 3em;
        margin-bottom: 20px;
        color: #333333;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="passage">
        <h2>Please read the passage below</h2>
        <p id="passageText">Loading passage...</p>
        <button id="startButton" onclick="showStartScreen()">Proceed...</button>
      </div>

      <div id="startScreen">
        <h2>Get Ready to Begin</h2>
        <p>
          When you're ready, click the button below to see the first prompt.
        </p>
        <button id="firstPromptButton" onclick="startPrompts()" disabled>
          Show First Prompt
        </button>
      </div>

      <div id="promptContainer">
        <p id="prompt">Press "Show First Prompt" to start.</p>
        <p id="timer">06:00</p>
        <button id="nextButton" onclick="nextPrompt()" disabled>Show Next Prompt</button>
      </div>
      <p id="sessionStatus" role="status" aria-live="polite">
        Loading prompts and saved position. If this message remains, check your connection and reload the page.
      </p>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
      import {
        getDatabase,
        ref,
        get,
        set,
      } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-database.js";

      // ✅ Global Variables
      let prompts = [];
      let currentPromptIndex = 0;
      let countdown;
      let ready = false;
      let saving = false;
      let sessionStarted = false;
      let db;

      function setStatus(message, isError = false) {
        const status = document.getElementById("sessionStatus");
        status.textContent = message;
        status.className = isError ? "error" : "";
      }

      function updateButtons() {
        document.getElementById("firstPromptButton").disabled =
          !ready || saving || sessionStarted;
        document.getElementById("nextButton").disabled =
          !ready || saving || !sessionStarted;
      }

      const firebaseConfig = {
        apiKey: "AIzaSyAHicQSrOLtnRDxUiWI_VSuEQvLdh-QtPs",
        authDomain: "echi-prompts.firebaseapp.com",
        databaseURL:
          "https://echi-prompts-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "echi-prompts",
        storageBucket: "echi-prompts.firebasestorage.app",
        messagingSenderId: "519393914993",
        appId: "1:519393914993:web:19b3405da27e7352ac2bd0",
      };

      async function loadPromptIndex() {
        const snapshot = await get(ref(db, "users/guest/promptIndex"));
        return snapshot.exists() ? snapshot.val() : 0;
      }

      function savePromptIndex(nextUnusedIndex) {
        return set(ref(db, "users/guest/promptIndex"), nextUnusedIndex);
      }

      async function loadPassage() {
        try {
          const response = await fetch("passage.txt");
          if (!response.ok) throw new Error("Failed to load passage.");
          const text = await response.text();
          document.getElementById("passageText").innerHTML = text;
          document.getElementById("passage").style.display = "block";
        } catch (error) {
          console.error("❌ Error loading passage:", error);
          document.getElementById("passageText").textContent = "Error loading passage.";
          throw error;
        }
      }

      async function loadPrompts() {
        try {
          const response = await fetch("prompts.txt");
          if (!response.ok) throw new Error("Failed to load prompts.");
          const text = await response.text();
          prompts = text
            .split("\n")
            .map((line) => line.trim())
            .filter((line) => line);
          if (prompts.length === 0) throw new Error("No prompts found.");

          currentPromptIndex = await loadPromptIndex();
          if (!Number.isInteger(currentPromptIndex) ||
              currentPromptIndex < 0 || currentPromptIndex >= prompts.length) {
            throw new Error("The saved prompt position is invalid for this prompt list.");
          }
          console.log("✅ Using saved prompt index:", currentPromptIndex);
        } catch (error) {
          console.error("❌ Error loading prompts:", error);
          throw error;
        }
      }

      function showStartScreen() {
        document.getElementById("passage").style.display = "none";
        document.getElementById("startScreen").style.display = "block";
      }

      async function saveAndShowPrompt(index, starting) {
        if (!ready || saving || starting === sessionStarted) return;
        saving = true;
        updateButtons();
        setStatus("Saving prompt position… Please wait.");
        // Keep controls locked if Firebase is still waiting for a connection.
        const warning = setTimeout(() => {
          setStatus("Saving is taking longer than expected. Check your connection. " +
            "Please keep this page open; the next prompt will appear once saving succeeds.", true);
        }, 10000);
        try {
          await savePromptIndex(index);
          currentPromptIndex = index;
          sessionStarted = true;
          document.getElementById("startScreen").style.display = "none";
          document.getElementById("promptContainer").style.display = "block";
          startPromptSession();
          setStatus("");
        } catch (error) {
          console.error("Error saving prompt position:", error);
          setStatus("Could not save the prompt position. No new prompt has been shown. " +
            "Check your connection or ask the experiment organiser to check database access, " +
            "then click the prompt button to retry.", true);
        } finally {
          clearTimeout(warning);
          saving = false;
          updateButtons();
        }
      }

      function startPrompts() {
        return saveAndShowPrompt(currentPromptIndex, true);
      }

      function startPromptSession() {
        if (prompts.length > 0) {
          document.getElementById("prompt").textContent =
            prompts[currentPromptIndex];
          document.getElementById("timer").style.display = "block";
          startTimer(360);
        }
      }

      function nextPrompt() {
        return saveAndShowPrompt((currentPromptIndex + 1) % prompts.length, false);
      }

      function startTimer(duration) {
        let timer = duration;
        const timerElement = document.getElementById("timer");
        clearInterval(countdown);

        countdown = setInterval(() => {
          let minutes = Math.floor(timer / 60);
          let seconds = timer % 60;
          timerElement.textContent = `${minutes
            .toString()
            .padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
          if (--timer < 0) {
            clearInterval(countdown);
            timerElement.style.color = "red";
          }
        }, 1000);
      }

      window.onload = async function () {
        try {
          const app = initializeApp(firebaseConfig);
          db = getDatabase(app);
          await loadPassage();
          await loadPrompts();
          ready = true;
          setStatus("");
        } catch (error) {
          console.error("Error preparing the session:", error);
          setStatus("Could not load the passage, prompts, or saved prompt position. " +
            "The session cannot start. Check your connection or ask the experiment organiser " +
            "to check database access, then reload this page.", true);
        } finally {
          updateButtons();
        }
      };

      window.showStartScreen = showStartScreen;
      window.startPrompts = startPrompts;
      window.nextPrompt = nextPrompt;
    </script>
  </body>
</html>
